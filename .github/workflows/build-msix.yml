name: Build UWP-GoW3-Launcher MSIX (Xbox Series S/X)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate UWP Artwork Icons
        shell: pwsh
        run: ./build/make-icons.ps1

      - name: Fetch gow3_pc Windows Runtime Payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./runtime-payload/StartupContent -Force | Out-Null
          if (-not (Test-Path ./runtime-payload/StartupContent/gow3-probe.exe)) {
            Write-Output "Downloading latest release from FelipePrado0/SpartanPort..."
            Invoke-WebRequest -Uri "https://github.com/FelipePrado0/SpartanPort/releases/latest/download/spartanport-windows.zip" -OutFile ./spartanport-windows.zip
            Expand-Archive -Path ./spartanport-windows.zip -DestinationPath ./gow3-extracted -Force
            $binDir = Get-ChildItem -Path ./gow3-extracted -Recurse -Directory -Filter "bin" | Select-Object -First 1
            if (-not $binDir) { $binDir = Get-Item ./gow3-extracted }
            Copy-Item -Path "$($binDir.FullName)\*" -Destination ./runtime-payload/StartupContent/ -Recurse -Force
            Remove-Item ./spartanport-windows.zip -Force
            Remove-Item ./gow3-extracted -Recurse -Force
          }

      - name: Compile GoW3NativeStartup.exe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl.exe /nologo /O2 /EHsc native\GoW3NativeStartup.cpp /link /SUBSYSTEM:WINDOWS user32.lib /OUT:runtime-payload\StartupContent\GoW3NativeStartup.exe

      - name: Create Test Signing Certificate & Build Signed MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./packages -Force | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=GoW3LauncherDev" `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -FriendlyName "UWP GoW3 Launcher Dev Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $pfxPath = (Join-Path (Resolve-Path ./packages).Path "UWP-GoW3-Launcher.pfx")
          $cerPath = (Join-Path (Resolve-Path ./packages).Path "UWP-GoW3-Launcher.cer")
          $pwd = ConvertTo-SecureString -String "gow3xbox" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password$pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath$cerPath | Out-Null

          $payloadDir = (Resolve-Path ./runtime-payload).Path
          msbuild source/
